name: MLB Tracker

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write    # ★追加

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Tracker
        env:
          GH_BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }} # ★変更
          ISSUE_NUMBER: ${{ secrets.ISSUE_NUMBER }}
        run: node index.js

      - name: Commit and Push state.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update MLB state" && git push)
