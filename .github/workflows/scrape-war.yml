name: Scrape WAR Data

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'GASから渡される対象のURL'
        required: true

permissions:
  issues: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 最強のスクレイピングライブラリをその場でインストール
      - name: Install dependencies
        run: npm install cheerio

      - name: Run Scraper
        env:
          GH_BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ secrets.ISSUE_NUMBER }}
          # GASから送られてきたURLを環境変数にセット
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: node scrape-war.js
